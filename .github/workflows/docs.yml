name: Deploy Docs

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 🧾 Checkout your repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 🐍 Setup Python (latest version)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ⚡ Cache MkDocs dependencies
      - name: Cache MkDocs
        uses: actions/cache@v4
        with:
          path: .cache
          key: ${{ runner.os }}-mkdocs-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-mkdocs-

      # 📦 Install dependencies for MkDocs
      - name: Install MkDocs
        run: |
          pip install --upgrade pip
          pip install mkdocs-material mkdocs-awesome-pages-plugin mkdocs-git-revision-date-plugin

      # 🚀 Build and deploy documentation to GitHub Pages
      - name: Deploy MkDocs Site
        run: mkdocs gh-deploy --force
